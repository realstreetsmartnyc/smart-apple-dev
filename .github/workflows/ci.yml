name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make tar curl git cmake pkg-config lld libplist-dev libssl-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ || echo "lint non-blocking"

      - name: Type check with mypy
        run: |
          mypy src/ || echo "mypy non-blocking"

      - name: Run tests
        run: pytest tests/ -v --cov=src/smartapple --cov-report=term --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  android:
    name: Android build (Kotlin template)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make tar curl git cmake unzip

      - name: Install Android SDK (cmdline-tools + platform 34 + build-tools)
        env:
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          rm tools.zip
          mv cmdline-tools latest
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          # `yes` outputs infinitely; when sdkmanager stops reading, yes
          # gets SIGPIPE → "Broken pipe" non-zero exit. With pipefail this
          # fails the step. Suppress yes's stderr and allow the pipe to
          # succeed (sdkmanager's actual license acceptance is what we need).
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('templates/kotlin/**/build.gradle*', 'templates/kotlin/**/settings.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Render kotlin template + build APK
        env:
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          # Render the kotlin template via the CLI (substitutes {{BUNDLE_ID}} etc).
          cd "$GITHUB_WORKSPACE"
          smart-apple-dev init app --lang kotlin
          # Build via gradle; skip Firebase's GoogleServices task since we have no
          # real Firebase project. (The plugin would fail with "no matching client"
          # without a real google-services.json from Firebase Console.)
          cd app
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK artifact
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "::error::No APK was produced by assembleDebug"
            exit 1
          fi
          echo "APK: $apk"
          ls -lh "$apk"
          # Quick smoke: APK must be a valid ZIP and contain AndroidManifest.xml
          unzip -l "$apk" | head -n 20
          unzip -l "$apk" | grep -q "AndroidManifest.xml"

      - name: Run Android-target tests
        run: pytest tests/test_android_target.py -v

  verify:
    name: End-to-end toolchain (verify.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make tar curl git cmake libplist-dev libssl-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install smart-apple-dev
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run verify.sh
        env:
          # verify.sh needs the macOS SDK tarball; pin to a known-good release
          SDK_TARBALL_URL: https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz
        run: |
          chmod +x verify/verify.sh
          # Skip doctl/etc that need network; the default flow is fine on CI.
          ./verify/verify.sh --local

      - name: Upload IPA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-artifacts
          path: |
            /tmp/sad-verify-*/app/build/macos/*.ipa
          if-no-files-found: ignore

  publish:
    needs: [test, verify]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          trusted-publishing: never
