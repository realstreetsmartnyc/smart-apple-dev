name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel in-flight runs on new pushes
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs + Material theme
        run: |
          python -m pip install --upgrade pip
          pip install \
            "mkdocs>=1.5" \
            "mkdocs-material>=9.5" \
            "mkdocs-autorefs>=1.0" \
            "mkdocs-awesome-nav>=3.0"

      - name: Build site
        # awesome-nav emits a non-fatal "nav replaced" warning; keep non-strict
        # so the workflow is green. The mkdocs.yml still validates the rest.
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
