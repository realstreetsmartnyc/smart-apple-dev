<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#1c2333"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ddc84"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid background -->
  <g opacity="0.05" stroke="#3ddc84" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="360" x2="1280" y2="360"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Right-side Android-bot silhouette -->
  <g transform="translate(920, 130)" fill="#3ddc84" opacity="0.18">
    <!-- antennae -->
    <line x1="80" y1="0" x2="60" y2="-30" stroke="#3ddc84" stroke-width="6" stroke-linecap="round"/>
    <line x1="160" y1="0" x2="180" y2="-30" stroke="#3ddc84" stroke-width="6" stroke-linecap="round"/>
    <!-- head -->
    <rect x="40" y="0" width="160" height="110" rx="55"/>
    <!-- eyes -->
    <circle cx="90" cy="55" r="9" fill="#0a0d12"/>
    <circle cx="150" cy="55" r="9" fill="#0a0d12"/>
    <!-- body -->
    <rect x="0" y="130" width="240" height="200" rx="20"/>
    <!-- arms -->
    <rect x="-50" y="150" width="50" height="120" rx="20"/>
    <rect x="240" y="150" width="50" height="120" rx="20"/>
    <!-- legs -->
    <rect x="60" y="340" width="40" height="60" rx="10"/>
    <rect x="140" y="340" width="40" height="60" rx="10"/>
  </g>

  <!-- Main title block -->
  <text x="80" y="180" font-family="Inter, system-ui, sans-serif" font-size="68" font-weight="800" fill="#f8fafc">Build for Android</text>
  <text x="80" y="230" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="500" fill="#3ddc84">from the same smart-apple-dev CLI</text>

  <!-- Divider -->
  <rect x="80" y="260" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="80" y="320" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#cbd5e1">One toolchain. Apple + Android targets. Linux or WSL.</text>
  <text x="80" y="350" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#cbd5e1">No Mac required.</text>

  <!-- Code example -->
  <rect x="80" y="395" width="600" height="140" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="80" y="395" width="600" height="28" rx="10" fill="#1e293b"/>
  <circle cx="98" cy="409" r="5" fill="#ef4444"/>
  <circle cx="116" cy="409" r="5" fill="#f59e0b"/>
  <circle cx="134" cy="409" r="5" fill="#22c55e"/>
  <text x="100" y="450" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#e2e8f0">$ smart-apple-dev init hello --lang kotlin</text>
  <text x="100" y="478" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#94a3b8">$ cd hello</text>
  <text x="100" y="506" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#94a3b8">$ smart-apple-dev build --target android</text>
  <text x="100" y="534" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#3ddc84">  -&gt; build/outputs/apk/debug/hello-debug.apk</text>

  <!-- Bottom badges -->
  <g transform="translate(80, 580)">
    <rect x="0" y="0" width="80" height="22" rx="11" fill="#0f172a" stroke="#3ddc84" stroke-width="1"/>
    <text x="40" y="15" text-anchor="middle" font-family="monospace" font-size="11" fill="#3ddc84">KOTLIN</text>

    <rect x="92" y="0" width="80" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="132" y="15" text-anchor="middle" font-family="monospace" font-size="11" fill="#38bdf8">GRADLE</text>

    <rect x="184" y="0" width="60" height="22" rx="11" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
    <text x="214" y="15" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">JDK17</text>

    <rect x="256" y="0" width="60" height="22" rx="11" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
    <text x="286" y="15" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">ADB</text>
  </g>

  <!-- URL -->
  <text x="1200" y="610" text-anchor="end" font-family="monospace" font-size="11" fill="#475569">github.com/realstreetsmartnyc/smart-apple-dev</text>
</svg>
