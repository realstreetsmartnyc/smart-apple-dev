# Godot Project Template
# Open-source game engine for 2D/3D games

PROJECT_NAME = "{{NAME}}"
BUNDLE_ID = "{{BUNDLE_ID}}"
VERSION = "0.1.0"
TARGET = "{{TARGET}}"
ENGINE = "godot"
ENGINE_VERSION = "4.2"

# Godot Build Configuration
GODOT = {
    "version": "4.2",
    "rendering_device": true,
    "vulkan": true,
    "metal": true,
    "open_gl_es3": false,
    "compression": "zstd",
    "threading_model": "multi_threaded",
}

# Platform-specific settings
{% if TARGET == "ios" %}
GODOT_TARGET = "iOS"
GODOT_PLATFORM = "ios"
IOS_DEPLOYMENT_TARGET = "15.0"
IOS_ARCH = "arm64"
IOS_SIMULATOR = false
{% elif TARGET == "ios-simulator" %}
GODOT_TARGET = "iOS"
GODOT_PLATFORM = "ios-simulator"
IOS_ARCH = "x86_64"
IOS_SIMULATOR = true
{% elif TARGET == "macos" %}
GODOT_TARGET = "Mac OSX"
GODOT_PLATFORM = "macos"
MACOS_DEPLOYMENT_TARGET = "10.15"
MACOS_ARCH = "arm64"
{% elif TARGET == "tvos" %}
GODOT_TARGET = "tvOS"
GODOT_PLATFORM = "tvos"
TVOS_DEPLOYMENT_TARGET = "15.0"
TVOS_ARCH = "arm64"
{% elif TARGET == "android" %}
GODOT_TARGET = "Android"
GODOT_PLATFORM = "android"
ANDROID_TARGET_API = 33
ANDROID_MIN_API = 21
{% elif TARGET == "web" %}
GODOT_TARGET = "Web"
GODOT_PLATFORM = "webgl"
{% endif %}

# Export Presets
EXPORT_PRESETS = [
    {
        "name": "iOS",
        "platform": "iOS",
        "include_filter": "",
        "exclude_filter": "",
        "export_path": "build/ios/{{NAME}}.ipa",
        "script_export_mode": 0,
        "options": {
            "architecture/arm64": true,
            "application/bundle_identifier": "{{BUNDLE_ID}}",
            "application/export_angle": false,
            "application/icon": "icon.png",
            "application/short_version": "{{VERSION}}",
            "application/version": "1",
            "application/app_store_team_id": "{{TEAM_ID}}",
            "application/provisioning_profile_uuid_debug": "",
            "application/provisioning_profile_uuid_release": "",
            "application/export_project_only": false,
            "capabilities/access_wifi": false,
            "capabilities/push_notifications": false,
            "capabilities/performance_gilbert_sphere": false,
            "capabilities/gc_3d": false,
            "capabilities/arkit": false,
            "capabilities/camera_usage_description": "",
            "capabilities/photokit_usage_description": "",
            "icons/iphone_120x120": "res://icons/120x120.png",
            "icons/iphone_180x180": "res://icons/180x180.png",
            "icons/ipad_76x76": "res://icons/76x76.png",
            "icons/ipad_152x152": "res://icons/152x152.png",
            "icons/app_store_1024x1024": "res://icons/1024x1024.png",
            "landscape_launch_screens/iphone_2208x1242": "res://icons/2208x1242.png",
            "landscape_launch_screens/ipad_1024x768": "res://icons/1024x768.png",
            "landscape_launch_screens/ipad_1366x1024": "res://icons/1366x1024.png",
            "portrait_launch_screens/iphone_640x960": "res://icons/640x960.png",
            "portrait_launch_screens/iphone_640x1136": "res://icons/640x1136.png",
            "portrait_launch_screens/iphone_750x1334": "res://icons/750x1334.png",
            "portrait_launch_screens/iphone_1125x2436": "res://icons/1125x2436.png",
            "portrait_launch_screens/ipad_768x1024": "res://icons/768x1024.png",
            "portrait_launch_screens/ipad_1024x1366": "res://icons/1024x1366.png",
        }
    }
]

# Project Settings
PROJECT_SETTINGS = {
    "application/run/main_scene": "res://scenes/Main.tscn",
    "application/config/name": "{{NAME}}",
    "application/config/description": "A game built with Godot",
    "application/config/version": "{{VERSION}}",
    "application/config/icon": "res://icon.png",
    "display/window/size/width": 1920,
    "display/window/size/height": 1080,
    "display/window/size/test_width": 1280,
    "display/window/size/test_height": 720,
    "display/window/stretch/mode": "canvas_items",
    "display/window/stretch/aspect": "expand",
    "rendering/vulkan/descriptor_pools/max_descriptors_per_pool": 64,
    "rendering/renderer/rendering_method": "mobile",
}

# Rendering
RENDERING = {
    "api": ["vulkan", "metal", "opengl_es3"],
    "renderer": "forward_plus",
    "msaa": "2x",
    "anisotropic_filter_level": 8,
    "shadow_atlas_size": "4096",
    "use_physical_light_units": true,
}

# Physics
PHYSICS = {
    "engine": "godot_physics",
    "2d": {
        "physics_engine": "godot_physics_2d",
        "default_gravity": 980,
    },
    "3d": {
        "physics_engine": "godot_physics_3d",
        "default_gravity": 9.8,
    },
}

# Audio
AUDIO = {
    "driver": "openal",
    "mix_rate": 48000,
    "output_latency": 15,
    "channel_count": 2,
}

# Input
INPUT = {
    "devices": ["touchscreen", "keyboard", "gamepad", "accelerometer"],
    "touch_sensitivity": 1.0,
    "emulate_touch_from_mouse": true,
    "emulate_mouse_from_touch": true,
}

# Testing
TESTING = {
    "framework": "GUT",
    "unit_tests": true,
    "integration_tests": true,
    "performance_tests": true,
}

# CI/CD
CI = {
    "provider": "github-actions",
    "build_targets": ["ios", "android", "macos", "web"],
    "auto_deploy": false,
}

# Optimization
OPTIMIZATION = {
    "texture_compression": "s3tc",
    "level_of_detail": true,
    "occlusion_culling": true,
    "bvh_build": true,
    "mesh_library": true,
}

# GDScript
GDSCRIPT = {
    "language_version": "2.0",
    "strict_typing": true,
    "inline_errors": true,
    "warnings": "all",
    "debug_collisions": true,
    "debug_paths": true,
}

# Assets
ASSETS = {
    "scenes": ["res://scenes/Main.tscn", "res://scenes/Menu.tscn", "res://scenes/Game.tscn"],
    "scripts": ["res://scripts/"],
    "shaders": ["res://shaders/"],
    "assets": ["res://assets/"],
    "fonts": ["res://fonts/"],
    "audio": ["res://audio/"],
}