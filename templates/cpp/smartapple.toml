# C++ / Objective-C Project Template
# Native performance for graphics and compute-intensive applications

PROJECT_NAME = "{{NAME}}"
BUNDLE_ID = "{{BUNDLE_ID}}"
VERSION = "0.1.0"
MIN_OS = "15.0"
TARGET = "{{TARGET}}"
LANGUAGE = "objc"

# Build System
BUILD_SYSTEM = "cpp"

# C++ / ObjC Flags
CPP_FLAGS = {
    "optimization": "speed",
    "c++_standard": "c++20",
    "arch": "{{ARCH}}",
    "macos_min": "10.15",
    "ios_min": "15.0",
}

# Platform-specific settings
{% if TARGET == "ios" %}
IOS_DEPLOYMENT_TARGET = "15.0"
SUPPORTED_ARCHS = ["arm64"]
{% elif TARGET == "macos" %}
MACOS_DEPLOYMENT_TARGET = "10.15"
SUPPORTED_ARCHS = ["arm64", "x86_64"]
{% elif TARGET == "macosx" %}
MACOSX_DEPLOYMENT_TARGET = "10.15"
SUPPORTED_ARCHS = ["arm64", "x86_64"]
{% endif %}

# C++ Source Files
SRC_FILES = [
    "Sources/main.cpp",
    "Sources/utility.cpp",
    "Sources/graphics.cpp",
    "Sources/memory.cpp",
]

# Objective-C Header/Source
OBJC_HEADER_FILES = [
    "Sources/AppDelegate.h",
    "Sources/ViewController.h",
]
OBJC_SOURCE_FILES = [
    "Sources/AppDelegate.m",
    "Sources/ViewController.m",
]

# Build Configuration
{% if RELEASE %}
BUILD_TYPE = "release"
OPTIMIZATION_LEVEL = "O2"
{% else %}
BUILD_TYPE = "debug"
OPTIMIZATION_LEVEL = "O0"
{% endif %}

# Testing
TESTING = {
    "framework": "google-test",
    "unit_tests": true,
    "integration_tests": true,
    "coverage": true,
}

# Dependencies
DEPENDENCIES = [
    "fmt",
    "spdlog",
    "opencv",
]

# Resources
RESOURCES = [
    "Assets.xcassets",
    "Info.plist",
]

# CI/CD
CI = {
    "provider": "github-actions",
    "test_on_simulator": true,
    "build_arch": "{{ARCH}}",
    "auto_deploy": false,
}