# Go Project Template
# Native iOS/macOS cross-compilation

PROJECT_NAME = "{{NAME}}"
BUNDLE_ID = "{{BUNDLE_ID}}"
VERSION = "0.1.0"
MIN_OS = "15.0"
TARGET = "{{TARGET}}"
LANGUAGE = "go"
ARCH = "arm64"

# Go Build Settings
GOOS = "{{GOOS}}"  # darwin, ios, ios-simulator
GOARCH = "{{GOARCH}}"  # arm64, amd64
CGO_ENABLED = "0"  # Disabled for iOS builds

# Target Triples
{% if TARGET == "ios" %}
GOOS = "ios"
GOARCH = "arm64"
{% elif TARGET == "ios-simulator" %}
GOOS = "ios"
GOARCH = "amd64"
{% elif TARGET == "macos" %}
GOOS = "darwin"
GOARCH = "arm64"
{% elif TARGET == "tvos" %}
GOOS = "tvos"
GOARCH = "arm64"
{% elif TARGET == "watchos" %}
GOOS = "watchos"
GOARCH = "arm64"
{% endif %}

# Build Modes
{% if RELEASE %}
GOFLAGS = "-ldflags=-s -w"
{% else %}
GOFLAGS = ""
{% endif %}

# Platform-specific settings
{% if TARGET == "ios" %}
IOS_ENABLED = true
IOS_SIMULATOR_ENABLED = false
SIMULATOR_ARCH = "amd64"
DEVICE_ARCH = "arm64"
{% elif TARGET == "macos" %}
MACOS_ENABLED = true
MACOS_X64_ENABLED = true
MACOS_ARM64_ENABLED = true
{% endif %}

# Dependencies
DEPENDENCIES = [
    # Third-party Go packages
    "github.com/!user/!repo",
]

# Resources
RESOURCES = [
    # iOS resources go here
    "Assets.xcassets",
    "Info.plist",
]

# CI/CD Configuration
CI = {
    "provider": "github-actions",
    "test_on_simulator": true,
    "cross_compile": true,
    "deploy_targets": ["ios", "macos"],
    "auto_deploy": false,
}

# Testing
TESTING = {
    "framework": "go-test",
    "unit_tests": true,
    "integration_tests": true,
    "coverage": true,
    "race_detector": true,
}

# Profiling
PROFILING = {
    "tools": ["go tool pprof", "delve"],
    "enable": true,
}