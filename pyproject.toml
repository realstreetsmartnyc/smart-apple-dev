[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-apple-dev"
version = "1.0.0"
description = "Cross-platform iOS/macOS development toolchain for Linux and Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "smart-apple-dev contributors" }]
keywords = ["ios", "macos", "mobile", "apple", "swift", "objective-c", "objc", "rust", "go", "kotlin", "xcode", "cross-platform", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "tomli>=2.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "paramiko>=2.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.3",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
smart-apple-dev = "smartapple.cli.app:cli"

[project.urls]
Homepage = "https://github.com/realstreetsmartnyc/smart-apple-dev"
Repository = "https://github.com/realstreetsmartnyc/smart-apple-dev"
Documentation = "https://github.com/realstreetsmartnyc/smart-apple-dev/blob/main/USER_GUIDE.md"
Issues = "https://github.com/realstreetsmartnyc/smart-apple-dev/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811", "E402", "I001", "W293", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["smartapple"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/smartapple"]
omit = ["tests/*", ".pytest_cache/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
